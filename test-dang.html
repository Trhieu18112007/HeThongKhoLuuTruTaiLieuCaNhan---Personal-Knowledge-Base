<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Đăng</title>
  <style>
    /* CSS tạm chỉ để test, CSS thật là của Hiền */
    body { font-family: Arial, sans-serif; padding: 12px; }
    .kb-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .kb-chip { padding: 4px 10px; border: 1px solid #999; border-radius: 12px; background: #fff; cursor: pointer; margin: 0 4px 4px 0; }
    .kb-chip--active { background: #0b5ed7; color: #fff; }
    .kb-view-card { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .kb-view-list { display: flex; flex-direction: column; gap: 8px; }
    .kb-card { border: 1px solid #ccc; border-radius: 8px; padding: 10px; }
    .kb-tag { background: #eef; border-radius: 8px; padding: 2px 6px; margin-right: 4px; font-size: 12px; }
    .kb-badge { font-weight: bold; font-size: 12px; text-transform: uppercase; }
    .kb-empty { padding: 20px; text-align: center; border: 1px dashed #999; }
    .kb-widgets { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; border-top: 2px solid #ccc; padding-top: 10px; }
  </style>
</head>
<body>
  <h2>Trang test của Đăng</h2>

  <div class="kb-toolbar">
    <input type="search" id="search-input" placeholder="Tìm tài liệu...">
    <select id="type-filter">
      <option value="all">Tất cả định dạng</option>
      <option value="pdf">PDF</option>
      <option value="video">Video</option>
      <option value="link">Liên kết</option>
    </select>
    <select id="sort-select">
      <option value="date-desc">Mới nhất</option>
      <option value="views-desc">Xem nhiều nhất</option>
      <option value="title-asc">Tên A → Z</option>
    </select>
    <button type="button" id="view-toggle">Dạng danh sách</button>
  </div>

  <div id="tag-chips"></div>
  <p id="result-count"></p>
  <div id="doc-container"></div>

  <div class="kb-widgets">
    <div><h3>Xem nhiều nhất</h3><ol id="top-viewed"></ol></div>
    <div><h3>Mới thêm</h3><ol id="recent"></ol></div>
    <div><h3>Thống kê</h3><div id="stats"></div></div>
  </div>

  <!-- Dữ liệu thật của nhóm trưởng (data.js phải nạp TRƯỚC storage.js) -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>

  <!-- Logic tạm thay cho file của Khang (xóa dòng này khi Khang merge js/logic.js) -->
  <script src="test-logic.js"></script>

  <!-- Code của Đăng -->
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
