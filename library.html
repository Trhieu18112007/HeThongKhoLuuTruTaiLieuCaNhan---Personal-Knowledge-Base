<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tìm kiếm, lọc và quản lý tài liệu PDF, video, liên kết theo từ khóa và tag.">
  <title>Kho tài liệu | LHU Second Brain</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="kb-header">
    <nav class="kb-nav" aria-label="Điều hướng chính">
      <a class="kb-brand" href="index.html" aria-label="LHU Second Brain, về trang chủ"><span aria-hidden="true">📚</span> LHU Second Brain</a>
      <input type="checkbox" id="kb-nav-toggle" class="kb-nav__toggle" aria-label="Hiển thị menu điều hướng">
      <label for="kb-nav-toggle" class="kb-nav__burger" aria-hidden="true">☰</label>
      <ul class="kb-nav__menu">
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="library.html" class="kb-active" aria-current="page">Kho tài liệu</a></li>
        <li><a href="add.html">Thêm tài liệu</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="kb-page-head">
      <div><span class="kb-section-label">THƯ VIỆN CÁ NHÂN</span><h1>Kho tài liệu</h1><p>Tìm tài liệu bạn cần, lọc theo loại và chủ đề, chọn cách hiển thị phù hợp.</p></div>
      <a class="kb-btn kb-add-link" href="add.html">+ Thêm tài liệu</a>
    </div>

    <section class="kb-library-panel" aria-label="Tìm kiếm và bộ lọc">
      <div class="kb-toolbar">
        <div class="kb-search-field">
          <label for="searchInput" class="kb-field-label">Tìm kiếm</label>
          <!-- ID searchInput theo js/app.js hiện tại của Đăng -->
          <input class="kb-input" id="searchInput" type="search" placeholder="Tìm tên, mô tả hoặc tag…" autocomplete="off">
        </div>
        <div class="kb-toolbar__field">
          <label class="kb-field-label" for="type-filter">Định dạng</label>
          <select class="kb-select" id="type-filter">
            <option value="all">Tất cả định dạng</option>
            <option value="pdf">PDF</option>
            <option value="video">Video</option>
            <option value="link">Liên kết</option>
          </select>
        </div>
        <div class="kb-toolbar__field">
          <label class="kb-field-label" for="sort-select">Sắp xếp</label>
          <select class="kb-select" id="sort-select">
            <option value="views">Xem nhiều nhất</option>
            <option value="date">Mới nhất</option>
            <option value="title">Tên A → Z</option>
          </select>
        </div>
      </div>
      <div class="kb-filter-row"><span class="kb-field-label">Chủ đề:</span><div class="kb-chips" id="tag-chips" role="group" aria-label="Lọc theo tag"></div></div>
      <div class="kb-result-row">
        <p class="kb-result-count" id="result-count" aria-live="polite">Đang tải tài liệu…</p>
        <div class="kb-view-toggle" id="view-toggle" role="group" aria-label="Kiểu hiển thị">
          <button class="kb-btn kb-btn--active" id="cardViewBtn" type="button" data-view="card" aria-pressed="true">▦ Thẻ</button>
          <button class="kb-btn kb-btn--ghost" id="listViewBtn" type="button" data-view="list" aria-pressed="false">☷ Danh sách</button>
        </div>
      </div>
    </section>

    <!-- Cùng một DOM dùng cho Card/List; renderDocumentCards ở js/ui.js sẽ gắn nội dung -->
    <section id="doc-container" class="kb-doc-container kb-view-card" aria-label="Danh sách tài liệu" aria-live="polite"></section>
  </main>
  <footer class="kb-footer"><p>© 2026 Nhóm 6 · Thiết kế Web (111101) · Đại học Lạc Hồng</p></footer>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
